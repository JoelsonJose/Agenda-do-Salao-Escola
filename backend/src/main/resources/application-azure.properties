spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-azure-sql.sql
spring.sql.init.data-locations=classpath:db/dados-iniciais-azure-sql.sql
spring.sql.init.separator=@@
spring.sql.init.continue-on-error=false
spring.h2.console.enabled=false
spring.security.user.name=${APP_USERNAME}
spring.security.user.password=${APP_PASSWORD}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
